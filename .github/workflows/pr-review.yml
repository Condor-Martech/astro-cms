name: PR Review (Claude Code)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # ponytail: esqueleto (AST-7). Requer o secret ANTHROPIC_API_KEY no repo — sem ele
    # o job falha e não bloqueia merge (branch protection cobre só o job de CI).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise o diff deste PR contra as convenções em CLAUDE.md e, quando presente
            no repositório, os cenários Gherkin de 02-spec.md §5. Aponte problemas de
            correção, segurança e aderência à SPEC. Poste os achados como comentários
            de review.
