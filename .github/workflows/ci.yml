name: CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ponytail: package.json ainda não existe em main/staging (scaffold em PR separado,
      # ver AST-3). Guard por hashFiles evita falso-vermelho até o scaffold ser mergeado;
      # remover o guard quando package-lock.json estiver na base branch.
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles('package-lock.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present
